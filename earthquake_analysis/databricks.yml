# This is a Declarative Automation Bundle definition for earthquake_analysis.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: earthquake_analysis
  uuid: 34f34c98-0e2b-451e-8674-7dfad4a0fe19

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-10e59e81-11cd.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-10e59e81-11cd.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/mymail61906@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mymail61906@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: mymail61906@gmail.com
        level: CAN_MANAGE
